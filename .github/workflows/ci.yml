name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lumo:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name lumo -p 8080:8080 lumo:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/api/v1/health && exit 0; sleep 1; done
          docker logs lumo; exit 1
